name: openproject-custom

networks:
  frontend:
  backend:

volumes:
  pgdata:
  opdata:

x-op-app: &op-app
  image: "${OPENPROJECT_IMAGE:?Set OPENPROJECT_IMAGE in .env}"
  pull_policy: always
  restart: unless-stopped
  init: true
  environment:
    OPENPROJECT_HTTPS: "${OPENPROJECT_HTTPS:-false}"
    OPENPROJECT_HSTS: "${OPENPROJECT_HSTS:-false}"
    OPENPROJECT_HOST__NAME: "${OPENPROJECT_HOST__NAME:-10.20.30.40:8080}"
    OPENPROJECT_ADDITIONAL__HOST__NAMES: "web"
    OPENPROJECT_DEFAULT__LANGUAGE: "${OPENPROJECT_DEFAULT__LANGUAGE:-ru}"
    OPENPROJECT_RAILS__CACHE__STORE: memcache
    OPENPROJECT_CACHE__MEMCACHE__SERVER: cache:11211
    OPENPROJECT_RAILS__RELATIVE__URL__ROOT: ""
    OPENPROJECT_COLLABORATIVE__EDITING__HOCUSPOCUS__URL: "${COLLABORATIVE_SERVER_URL:-ws://10.20.30.40:8080/hocuspocus}"
    OPENPROJECT_COLLABORATIVE__EDITING__HOCUSPOCUS__SECRET: "${COLLABORATIVE_SERVER_SECRET:?Set COLLABORATIVE_SERVER_SECRET in .env}"
    DATABASE_URL: "postgres://${POSTGRES_USER:-openproject}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-openproject}?pool=20&encoding=unicode&reconnect=true"
    RAILS_MIN_THREADS: "${RAILS_MIN_THREADS:-4}"
    RAILS_MAX_THREADS: "${RAILS_MAX_THREADS:-16}"
    SECRET_KEY_BASE: "${SECRET_KEY_BASE:?Set SECRET_KEY_BASE in .env}"
    IMAP_ENABLED: "${IMAP_ENABLED:-false}"
  volumes:
    - opdata:/var/openproject/assets

services:
  db:
    image: "postgres:${POSTGRES_VERSION:-17}"
    pull_policy: always
    restart: unless-stopped
    stop_grace_period: 10s
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-openproject}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}"
      POSTGRES_DB: "${POSTGRES_DB:-openproject}"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-openproject} -d ${POSTGRES_DB:-openproject}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  cache:
    image: memcached:1.6-alpine
    pull_policy: always
    restart: unless-stopped
    command: ["memcached", "-m", "128", "-I", "4m"]
    networks:
      - backend

  seeder:
    <<: *op-app
    command: ./docker/prod/seeder
    restart: on-failure
    networks:
      - backend
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_started

  web:
    <<: *op-app
    command: ./docker/prod/web
    stop_grace_period: 30s
    networks:
      - frontend
      - backend
    depends_on:
      seeder:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health_checks/default"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  worker:
    <<: *op-app
    command: ./docker/prod/worker
    stop_grace_period: 30s
    networks:
      - backend
    depends_on:
      seeder:
        condition: service_completed_successfully

  cron:
    <<: *op-app
    command: ./docker/prod/cron
    networks:
      - backend
    depends_on:
      seeder:
        condition: service_completed_successfully

  hocuspocus:
    image: openproject/hocuspocus:17.9.1
    pull_policy: always
    restart: unless-stopped
    environment:
      SECRET: "${COLLABORATIVE_SERVER_SECRET:?Set COLLABORATIVE_SERVER_SECRET in .env}"
      OPENPROJECT_URL: http://web:8080
      OPENPROJECT_HTTPS: "${OPENPROJECT_HTTPS:-false}"
    networks:
      - frontend
      - backend
    depends_on:
      web:
        condition: service_healthy

  proxy:
    image: caddy:2
    pull_policy: always
    restart: unless-stopped
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${PORT:-8080}:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    networks:
      - frontend
    depends_on:
      web:
        condition: service_healthy
      hocuspocus:
        condition: service_started
